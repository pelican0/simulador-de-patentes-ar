<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Simulador de Patentes - Mercosur AR</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<div class="page">
			<header class="header">
				<h1>Simulador de Patentes AR (Mercosur)</h1>
				<div class="controls">
					<label class="control">
						<span>Intervalo (ms)</span>
						<input id="intervalInput" type="number" min="200" step="100" value="1500" />
					</label>
					<label class="control">
						<span>Semilla (opcional)</span>
						<input id="seedInput" type="text" placeholder="p. ej. demo" />
					</label>
					<button id="startBtn" class="btn primary">Iniciar</button>
					<button id="stopBtn" class="btn">Detener</button>
					<button id="nextBtn" class="btn">Siguiente</button>
				</div>
			</header>

			<main>
				<!-- Contenedor de la chapa; el tamaño se adapta a la imagen -->
				<div id="plateContainer" class="plate">
					<img id="plateImg" src="./imgs/Mercosur.png" alt="Placa Mercosur Argentina" class="plate-img" />
					<!-- Capa de texto posicionada sobre la imagen -->
					<div id="overlay" class="overlay">
						<!-- Texto completo (tres grupos) -->
						<div id="plateText" class="plate-text" aria-label="texto de patente">AG 759 LH</div>
					</div>
				</div>
			</main>

			<footer class="footer">
				<p>Barra espaciadora: iniciar/detener • Valores quedan guardados</p>
			</footer>
		</div>

		<script src="./script.js"></script>
	</body>
	</html>
